<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio 03 · Tree testing</title><style>body{font:17px/1.6 system-ui;background:#edf2fa;color:#162b45;margin:0}main{max-width:820px;margin:auto;padding:24px}h1{line-height:1.2}section{background:white;padding:24px;border-radius:16px;margin:14px 0}button{padding:12px 16px;cursor:pointer;background:#f5f8fe;border:1px solid #bbcde3;border-radius:7px;margin:4px;color:#172c46}button:focus-visible{outline:3px solid #275cb0}#path{font-weight:600;color:#1e4c8c}#result{font-weight:700}a{color:#174994}</style></head><body><main><p>MANUAL UI/UX · CAPÍTULO 03</p><h1>Laboratorio de navegación</h1><p>Necesitas un documento que demuestre que uno de tus hijos está inscrito este periodo. ¿Dónde lo buscarías? Este ejercicio didáctico no recoge datos ni representa investigación real.</p><section><label for="tree">Selecciona arquitectura:</label> <select id="tree"><option value="a">A. Institucional</option><option value="b">B. Por estudiante</option></select><p id="path" aria-live="polite"></p><div id="choices"></div><p><button id="back">← Retroceder</button><button id="reset">Reiniciar</button></p><p id="result" aria-live="polite"></p></section><p><a href="../capitulos/03.html">Volver al capítulo 03</a></p></main><script>
const trees={a:{name:'Inicio',children:[{name:'Mi perfil'},{name:'Mis clases'},{name:'Trámites institucionales',children:[{name:'Gestión documental',children:[{name:'Certificaciones',children:[{name:'Constancia de matrícula',ok:true}]}]},{name:'Solicitudes'}]}]},b:{name:'Inicio',children:[{name:'Estudiantes',children:[{name:'Estudiante seleccionado',children:[{name:'Calificaciones'},{name:'Asistencia'},{name:'Documentos y constancias',children:[{name:'Constancia de matrícula',ok:true}]}]}]},{name:'Pagos'},{name:'Comunicaciones'}]}};
let stack=[],backs=0,first='',done=false;const $=id=>document.getElementById(id);function reset(){stack=[trees[$('tree').value]];backs=0;first='';done=false;$('result').textContent='';draw()}function draw(){const node=stack.at(-1);$('path').textContent=stack.map(x=>x.name).join(' → ');$('choices').replaceChildren();$('back').disabled=stack.length===1||done;if(done)return;for(const child of node.children||[]){const btn=document.createElement('button');btn.textContent=child.name;btn.onclick=()=>{if(!first)first=child.name;stack.push(child);if(!child.children){done=true;$('result').textContent=(child.ok?'Destino encontrado.':'No era el destino esperado.')+' Primer clic: '+first+'. Retrocesos: '+backs+'.'}draw()};$('choices').append(btn)}}$('back').onclick=()=>{if(stack.length>1){backs++;stack.pop();draw()}};$('reset').onclick=reset;$('tree').onchange=reset;reset();
</script></body></html>
